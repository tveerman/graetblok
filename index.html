    <button id="btnZoo" title="Dierenboek (B)">🐾</button>
    <button id="btnJob" title="Mijn werk (J)">💼</button>
    <button id="btnCam" title="Camera (V of F5)">📷</button>

  </div>

  <div id="bottom">

    <div id="air" class="hidden"></div>
    <div id="status">

      <div id="xpwrap"><div id="xpbar"><div id="xpfill"></div></div><div id="lvl"></div></div>
    </div>
    <div id="hotbar"></div>
  </div>
  <button id="btnRide" class="hidden">🐉 Vliegen</button>
  <div id="joy"><div id="joyknob"></div></div>
  <div id="touchbtns">
    <button id="btnOff">Afstappen</button>
    <button id="btnDown">⬇</button>
    <button id="btnUse">✋</button>

    <button id="btnJump">⬆</button>

</div>

<div id="vignette"></div>

    <div id="modalBody"></div>
  </div>
</div>

<div id="loading" class="hidden"><div class="spinner"></div><div id="loadingText"></div></div>

<div id="menu">
  <div id="menuBox">
    <h1>GRAET BLOK</h1>
    <p class="tag">Een gigantische wereld vol monsters, draken, machines, geheimen en vrienden.</p>
    <div id="loadBox">
      <div id="loadBar"><div id="loadFill"></div></div>
      <p id="loadText">Het spel wordt geladen...</p>
    </div>
    <button id="btnPlay" class="btn big hidden">▶ Spelen</button>
    <div id="updateBox" class="hidden">
      <button id="btnReload" class="btn gold">🔄 Opnieuw laden</button>
      <p id="updateText">Er is een nieuwe versie van het spel!</p>
    </div>
    <div class="lookbox">
      <div class="looklabel">Wie ben jij?</div>
      <div id="lookTypes" class="btnrow"></div>
      <div id="lookColors" class="btnrow"></div>
    </div>
    <button id="btnNew" class="btn small danger hidden">Nieuwe wereld beginnen</button>
    <p id="menuError"></p>
    <p class="credit">Bedacht door Jorian<span id="versionText"></span></p>
    <p id="serverStatus" class="credit"></p>
    <p id="offlineStatus" class="credit"></p>
  </div>
</div>

<script>
// Vangnet. Soms bewaart de browser een paar oude bestanden van het spel die niet meer bij de
// nieuwe passen; dan start het spel niet en zie je alleen dit beginscherm zonder dat er iets
// gebeurt. In dat geval halen we alle bestanden vers op en proberen het één keer opnieuw.
(function () {
  var KEY = 'graetblok.herstel', bezig = false;
  // laat onderaan het scherm zien wat er misging (handig om door te geven)
  function toon(tekst) {
    var p = document.getElementById('startFout');
    if (!p) { p = document.createElement('p'); p.id = 'startFout'; p.style.cssText = 'position:fixed;left:8px;right:8px;bottom:8px;z-index:99;margin:0;padding:8px 10px;border-radius:8px;background:rgba(0,0,0,.75);color:#ffd0d0;font:13px sans-serif;text-align:center'; document.body.appendChild(p); }
    p.textContent = tekst;
  }
  function herstel(fout) {
    if (window.graetGestart || bezig) return;      // (window.game kan hier niet: zo heet ook het tekenvlak)
    if (fout && fout.message) toon('Het spel kon niet starten: ' + fout.message);
    var last = 0;
    try { last = +sessionStorage.getItem(KEY) || 0; } catch (e) { /* geeft niet */ }
    if (Date.now() - last < 120000) { if (!fout) toon('Het spel start niet. Tik op het rondje met de pijl bovenin om de pagina opnieuw te laden.'); return; }          // niet eindeloos blijven proberen
    bezig = true;
    try { sessionStorage.setItem(KEY, String(Date.now())); } catch (e) { /* geeft niet */ }
    fetch('files.json', { cache: 'reload' }).then(function (r) { return r.json(); }).then(function (list) {
      return Promise.all(list.map(function (f) { return fetch(f, { cache: 'reload' }).then(function (r) { return r.arrayBuffer(); }); }));
    }).then(function () { location.reload(); }).catch(function () { bezig = false; });
  }
  window.graetHerstel = herstel;
  window.addEventListener('error', function (e) { var f = e && e.error; setTimeout(function () { herstel(f); }, 500); }, true);
  window.addEventListener('load', function () { setTimeout(herstel, 20000); });
})();
</script>
<script>
// De balk op het beginscherm. Zolang het spel nog bestanden ophaalt, zichzelf opbouwt of kijkt
// of er een nieuwe versie is, staat hier een balk in plaats van de knop "Spelen": zo zie je
// dat er iets gebeurt en hoef je niet op een knop te drukken die nog niets doet.
(function () {
  var klaar = { spel: false, versie: false }, getoond = false;
  function el(id) { return document.getElementById(id); }
  // tekst = wat er gebeurt, deel = hoe ver (0..1; weglaten = de balk blijft staan waar hij stond)
  window.graetLaad = function (tekst, deel) {
    if (getoond) return;
    el('loadText').textContent = tekst;
    if (typeof deel === 'number') el('loadFill').style.width = Math.round(Math.max(0, Math.min(1, deel)) * 100) + '%';
  };
  // wat = 'spel' (het spel is opgebouwd) of 'versie' (er is gekeken of er een nieuwe versie is)
  window.graetKlaar = function (wat) {
    klaar[wat] = true;
    if (getoond || !klaar.spel || !klaar.versie) return;
    getoond = true;
    el('loadBox').classList.add('hidden');
    el('btnPlay').classList.remove('hidden'); el('btnNew').classList.remove('hidden');
  };
  // weer terug naar de balk (er wordt een nieuwe versie opgehaald en daarna herladen)
  window.graetBezig = function (tekst, deel) {
    getoond = false;
    el('loadBox').classList.remove('hidden');
    el('btnPlay').classList.add('hidden'); el('btnNew').classList.add('hidden');
    window.graetLaad(tekst, deel);
  };
})();
</script>
<script type="module">
// Het spel starten: eerst alle bestanden ophalen (dan kan de balk laten zien hoe ver het is),
// daarna het spel zelf opbouwen. Lukt dat niet (een bestand ontbreekt of past niet bij de
// rest), dan het vangnet hierboven.
(async function () {
  try {
    const list = await (await fetch('files.json')).json();
    let done = 0, next = 0;
    const one = async () => {
      while (next < list.length) {
        const f = list[next++];
        try { await (await fetch(f)).arrayBuffer(); } catch (e) { /* het spel probeert het straks zelf nog eens */ }
        window.graetLaad('Het spel wordt opgehaald... ' + (++done) + ' van ' + list.length, 0.05 + 0.75 * done / list.length);
      }
    };
    await Promise.all([one(), one(), one(), one(), one(), one()]);
  } catch (e) { /* geen lijst (bijv. geen verbinding): het spel laadt zijn bestanden dan zelf */ }
  window.graetLaad('Het spel wordt opgebouwd...', 0.85);
  // even wachten tot de balk getekend is: het opbouwen houdt daarna het scherm een paar tellen vast
  await new Promise((r) => { let ok = false; const go = () => { if (!ok) { ok = true; r(); } }; requestAnimationFrame(() => requestAnimationFrame(go)); setTimeout(go, 250); });
  try {
    await import('./src/client/main.js');
    window.graetLaad('Kijken of er een nieuwe versie is...', 0.95);
    window.graetKlaar('spel');
    // lukt het kijken naar een nieuwe versie niet, dan na een tijdje toch de knop laten zien
    setTimeout(() => window.graetKlaar('versie'), 15000);
  } catch (e) {
    console.error('Het spel kon niet starten:', e);
    if (window.graetHerstel) window.graetHerstel(e);
  }
})();
</script>
</body>
</html>
